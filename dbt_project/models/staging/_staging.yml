version: 2

models:
  - name: stg_pbp
    description: One row per play across 2019–2025, unioned by column name and typed from raw nflverse season tables.
    columns:
      - name: game_id
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: play_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - play_id

  - name: stg_schedules
    description: One row per completed game, with final score.
    columns:
      - name: game_id
        tests:
          - not_null
          - unique
      - name: season
        tests:
          - not_null
      - name: home_team
        tests:
          - not_null
          - relationships:
              to: ref('stg_teams')
              field: team_abbr
      - name: away_team
        tests:
          - not_null
          - relationships:
              to: ref('stg_teams')
              field: team_abbr
      - name: home_score
        tests:
          - not_null
      - name: away_score
        tests:
          - not_null

  - name: stg_teams
    description: Team reference data (name, conference, division).
    columns:
      - name: team_abbr
        tests:
          - not_null
          - unique
